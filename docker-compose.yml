# YAML anchors (Fase 9.4.1 #7) — reduzem duplicação entre backend/worker/beat.
# Mudar o env aqui propaga pros 3 serviços.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://ged_user:ged_password_secure_local@db:5432/ged_saas_db
  APP_NAME: sistemas
  CIDADE_CONN: ged_saas_db
  ENVIRONMENT: desenvolvimento
  UPLOADS_DIR: /app/uploads/anexos
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  JOBS_RESULTS_DIR: /app/uploads/jobs
  # DEV-ONLY: chave Fernet de dados sensíveis. Em produção NÃO usar este valor —
  # sobrescrever via secret real (env/secret store), como o dev DB password.
  DADOS_SENSIVEIS_ENCRYPTION_KEY: 7qeLLAFqcrdD_Zo5A4Ip28YUi7x7M_7BxlFv-knsnP0=

x-backend-volumes: &backend-volumes
  - ./backend:/app
  - ./uploads:/app/uploads
  - ./keys:/app/keys:ro

x-backend-networks: &backend-networks
  - aprimora_default
  - aprimora-py

services:
  schema-init:
    image: postgres:17-alpine
    container_name: aprimora-py-schema-init
    environment:
      PGPASSWORD: ged_password_secure_local
    volumes:
      - ./ci/legacy-schema-filtered.sql:/tmp/legacy-schema-filtered.sql:ro
    networks:
      - aprimora-py
    command: sh -c "sleep 3 && psql -h db -U ged_user -d ged_saas_db -f /tmp/legacy-schema-filtered.sql 2>&1 | grep -v ERROR | tail -3 && echo 'OK'"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["init"]

  db-init:
    build: ./backend
    container_name: aprimora-py-db-init
    environment: *backend-env
    volumes: *backend-volumes
    networks: *backend-networks
    command: sh -c "cd /app && python -m alembic upgrade head && echo '✅ Migrations complete'"
    depends_on:
      schema-init:
        condition: service_completed_successfully
    profiles: ["init"]

  backend:
    build: ./backend
    container_name: aprimora-py-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      JWT_SECRET_SOURCE: db
      JWT_TTL_SECONDS: "3600"
      JWT_ALGORITHM: HS256  # Trocar para RS256 no cutover (PHP perde interop JWT, mas usa PHPSESSID próprio)
      ALLOWED_ORIGINS: http://localhost:8090,http://localhost:3000,http://localhost:3100
      MAX_UPLOAD_SIZE_MB: "20"
    ports:
      - "8000:8000"
    volumes: *backend-volumes
    networks: *backend-networks
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_started
    # Healthcheck (Fase 9.4.2 #4) — nginx só aceita backend depois disso ficar verde.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build: ./backend
    container_name: aprimora-py-worker
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    networks: *backend-networks
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  beat:
    build: ./backend
    container_name: aprimora-py-beat
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    networks: *backend-networks
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    container_name: aprimora-py-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8090/api/v2
      INTERNAL_API_URL: http://backend:8000/api/v2
      NODE_ENV: development
    ports:
      - "3100:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - aprimora-py
    command: npm run dev

  redis:
    image: redis:7-alpine
    container_name: aprimora-py-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # bind só local pra não expor o broker
    networks:
      - aprimora-py

  e2e:
    build: ./tests-e2e
    container_name: aprimora-py-e2e
    profiles: ["test"]  # só sobe com: docker compose --profile test run --rm e2e
    environment:
      PY_BASE: http://nginx
      PHP_BASE: http://protocolo
    volumes:
      - ./tests-e2e/specs:/e2e/specs:ro
      - ./tests-e2e/playwright.config.ts:/e2e/playwright.config.ts:ro
      - ./tests-e2e/report:/e2e/report
    networks:
      - aprimora-py
      - aprimora_default  # alcança PHP legacy via alias `protocolo`

  nginx:
    image: nginx:1.27-alpine
    container_name: aprimora-py-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy  # Fase 9.4.2 #4 — espera health
      frontend:
        condition: service_started
    networks:
      - aprimora-py
      - aprimora_default  # alcança aprimora-protocolo (PHP) via alias `protocolo`

  db:
    image: postgres:17-alpine
    container_name: aprimora-py-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ged_user
      POSTGRES_PASSWORD: ged_password_secure_local
      POSTGRES_DB: ged_saas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aprimora-py
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ged_user -d ged_saas_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  aprimora-py:
    driver: bridge
  aprimora_default:
    external: true
