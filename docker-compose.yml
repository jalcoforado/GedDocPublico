# YAML anchors (Fase 9.4.1 #7) — reduzem duplicação entre backend/worker/beat.
# Mudar o env aqui propaga pros 3 serviços.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://ged_user:ged_password_secure_local@db:5432/ged_saas_db
  # Papel de banco POR CONSUMIDOR (SEC-RLS-00B). Vazio = cai em DATABASE_URL,
  # que é o estado de hoje em TODOS os ambientes — este PR não troca o valor
  # efetivo de nenhum. A troca é o gate `SEC-RLS-ROLLOUT`, e é feita
  # definindo a variável no `.env` da raiz; o rollback é apagá-la.
  #
  # Os papéis existem no banco (`aprimora_app` desde a 0006, `aprimora_worker`
  # e `aprimora_migrator` desde a 0078), todos NOSUPERUSER e NOBYPASSRLS.
  APP_DATABASE_URL: ${APP_DATABASE_URL:-}
  WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
  MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:-}
  APP_NAME: sistemas
  CIDADE_CONN: ged_saas_db
  ENVIRONMENT: desenvolvimento
  UPLOADS_DIR: /app/uploads/anexos
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  JOBS_RESULTS_DIR: /app/uploads/jobs
  # Chave Fernet dos dados sensíveis (tokens OAuth do Google, dados bancários
  # de fornecedor). Vem do `.env` da raiz, que é gitignored — versioná-la
  # tornava pública a chave que cifra o que há de mais sensível no banco.
  # Sem `.env`, o compose aborta com a mensagem abaixo em vez de subir com um
  # segredo padrão. Como gerar: ver `.env.example`.
  DADOS_SENSIVEIS_ENCRYPTION_KEY: ${DADOS_SENSIVEIS_ENCRYPTION_KEY:?defina no .env da raiz — veja .env.example}

x-backend-volumes: &backend-volumes
  - ./backend:/app
  - ./uploads:/app/uploads
  - ./keys:/app/keys:ro

x-backend-networks: &backend-networks
  - aprimora_default
  - aprimora-py

services:
  bootstrap:
    build: ./backend
    container_name: aprimora-py-bootstrap
    environment:
      <<: *backend-env
      PGHOST: db
      PGUSER: ged_user
      PGPASSWORD: ged_password_secure_local
      PGDATABASE: ged_saas_db
      CI_DIR: /ci
    volumes:
      - ./backend:/app
      - ./ci:/ci:ro
      - ./scripts:/scripts:ro
    networks: *backend-networks
    working_dir: /app
    command: sh -c "bash /scripts/bootstrap-db.sh"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["init"]

  backend:
    build: ./backend
    container_name: aprimora-py-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      JWT_SECRET_SOURCE: db
      JWT_TTL_SECONDS: "3600"
      JWT_ALGORITHM: HS256  # Trocar para RS256 no cutover (PHP perde interop JWT, mas usa PHPSESSID próprio)
      ALLOWED_ORIGINS: http://localhost:8090,http://localhost:3000,http://localhost:3100
      MAX_UPLOAD_SIZE_MB: "20"
    ports:
      # Só localhost. A entrada pública é o nginx na 8090 — publicar o backend
      # em 0.0.0.0 contornava o nginx e, com STRICT_TENANT_RESOLUTION=false,
      # entregava o tenant padrão sem passar pela resolução por `Host`.
      - "127.0.0.1:8000:8000"
    volumes: *backend-volumes
    networks: *backend-networks
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_started
    # Healthcheck (Fase 9.4.2 #4) — nginx só aceita backend depois disso ficar verde.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build: ./backend
    container_name: aprimora-py-worker
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    networks: *backend-networks
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  beat:
    build: ./backend
    container_name: aprimora-py-beat
    restart: unless-stopped
    environment: *backend-env
    volumes: *backend-volumes
    networks: *backend-networks
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    # Produção por padrão (build standalone). Para dev com hot-reload use:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    build:
      context: ./frontend
      target: runner
      args:
        # same-origin via nginx; inlined no bundle do browser em build-time.
        NEXT_PUBLIC_API_URL: /api/v2
    container_name: aprimora-py-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:8000/api/v2
      NODE_ENV: production
    ports:
      # Só localhost — o Next é servido ao público pelo nginx.
      - "127.0.0.1:3100:3000"
    networks:
      - aprimora-py

  redis:
    image: redis:7-alpine
    container_name: aprimora-py-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # bind só local pra não expor o broker
    networks:
      - aprimora-py

  e2e:
    build: ./tests-e2e
    container_name: aprimora-py-e2e
    profiles: ["test"]  # só sobe com: docker compose --profile test run --rm e2e
    environment:
      PY_BASE: http://nginx
      PHP_BASE: http://protocolo
    volumes:
      - ./tests-e2e/specs:/e2e/specs:ro
      - ./tests-e2e/playwright.config.ts:/e2e/playwright.config.ts:ro
      - ./tests-e2e/report:/e2e/report
    networks:
      - aprimora-py
      - aprimora_default  # alcança PHP legacy via alias `protocolo`

  nginx:
    image: nginx:1.27-alpine
    container_name: aprimora-py-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy  # Fase 9.4.2 #4 — espera health
      frontend:
        condition: service_started
    networks:
      - aprimora-py
      - aprimora_default  # alcança aprimora-protocolo (PHP) via alias `protocolo`

  db:
    image: postgres:17-alpine
    container_name: aprimora-py-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ged_user
      POSTGRES_PASSWORD: ged_password_secure_local
      POSTGRES_DB: ged_saas_db
    ports:
      # Só localhost. Até 2026-08-05 esta linha era "5432:5432", ou seja
      # 0.0.0.0, e na VPS o Postgres respondia da internet — com a senha logo
      # acima, literal, num repositório PÚBLICO, e `ged_user` sendo SUPERUSER
      # com BYPASSRLS. Verificado: a 5432 aceitava conexão e o servidor sequer
      # oferecia TLS (SSLRequest -> 'N').
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aprimora-py
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ged_user -d ged_saas_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  aprimora-py:
    driver: bridge
  aprimora_default:
    external: true
