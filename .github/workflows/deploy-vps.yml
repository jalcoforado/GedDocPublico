name: Deploy to VPS

# O gatilho é `workflow_run` sobre o `Backend tests`, NÃO `push`.
#
# Até 2026-08-04 os quatro workflows disparavam juntos no push para `main`, o
# que significa que a VPS recebia código mesmo quando a suíte reprovava. Não é
# hipótese: aconteceu na fatia P5.1 (`a1a0c8e`) — `Backend tests` vermelho,
# `Deploy to VPS` verde, código quebrado na VPS.
#
# Por que só o `Backend tests` no gatilho, e não os três: `workflow_run` com
# vários workflows dispara UMA VEZ POR WORKFLOW que termina, não uma vez quando
# todos terminam. Três gatilhos correndo juntos poderiam iniciar dois deploys
# simultâneos — e `concurrency: cancel-in-progress` seria pior ainda, porque
# interromperia um deploy no meio. Com um gatilho só há uma execução por push,
# e o job `gate` confere os outros dois por API antes de liberar. O `Backend
# tests` é o mais lento (~8 min contra ~1 min dos outros), então quando ele
# termina os demais já terminaram.
#
# O filtro `paths:` FOI REMOVIDO junto com o gatilho de push — `workflow_run`
# não aceita filtro de caminho. A troca é deliberada: o pior que acontece agora
# é um build de ~5 min desperdiçado num push só de documentação, contra o
# antigo "meu código não está na VPS e não sei por quê", que é silencioso.
#
# ~~LIMITE CONHECIDO~~ **RESOLVIDO em 2026-08-16.** O `deploy.sh` fazia
# `git reset --hard origin/main` na VPS, então subia o `main` do MOMENTO DO
# DEPLOY e não o SHA que passou pelos testes: commit que entrasse em `main`
# entre o fim da suíte e o deploy ia junto, sem nunca ter passado pelo portão.
# O portão aprovava um SHA e a VPS recebia outro. Agora o `DEPLOY_SHA` é
# passado ao script e ele faz `reset --hard` nesse commit; sem a variável
# (invocação manual no servidor) o comportamento antigo continua valendo.
#
# ATENÇÃO ao primeiro deploy depois desta mudança: `pull_code` sobrescreve o
# próprio `deploy.sh` enquanto o bash já o está executando, e o `exec` de
# re-execução só acontece DEPOIS do pull. Ou seja, a primeira rodada ainda usa
# o `pull_code` antigo e ignora o `DEPLOY_SHA`. O pinning passa a valer da
# segunda em diante — é a mesma armadilha registrada no `CLAUDE.md`.

on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deploy type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
  VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
  # Diretório da instalação REAL no VPS. Apontava para /app, que era um clone
  # paralelo e vazio: como o compose deriva o nome do projeto do diretório, /app
  # virava o projeto `app` e ganhava um volume `app_postgres_data` novo — sem
  # schema nem dados — enquanto os dados de verdade seguiam em
  # `geddocpublico_postgres_data`. Os `container_name:` fixos são globais no
  # daemon, então as duas instalações colidiam por nome a cada deploy.
  DEPLOY_PATH: /root/GedDocPublico

jobs:
  # Portão: só libera o deploy se os TRÊS workflows de teste passaram no MESMO
  # commit. Um `workflow_dispatch` passa direto — é o escape manual de sempre.
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      liberado: ${{ steps.checa.outputs.liberado }}
    steps:
      - name: Conferir os três workflows de teste no mesmo SHA
        id: checa
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSAO_GATILHO: ${{ github.event.workflow_run.conclusion }}
          EVENTO_ORIGEM: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail

          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "Disparo manual: o portão não se aplica."
            echo "liberado=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `Backend tests` também roda em pull_request. O `branches: [main]`
          # do gatilho filtra quase tudo, mas um PR cuja head seja `main`
          # passaria — deploy só a partir de push.
          if [ "$EVENTO_ORIGEM" != "push" ]; then
            echo "Execução de origem foi '$EVENTO_ORIGEM', não push. Deploy BARRADO."
            echo "liberado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # O próprio gatilho já traz a conclusão do Backend tests. Se ele não
          # passou, nada mais precisa ser consultado.
          if [ "$CONCLUSAO_GATILHO" != "success" ]; then
            echo "Backend tests terminou como '$CONCLUSAO_GATILHO'. Deploy BARRADO."
            echo "liberado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Os outros dois, por API, no mesmo SHA. `last` porque um re-run cria
          # execução nova com o mesmo `head_sha` — a que vale é a mais recente.
          # O `tr` existe porque `gh api --jq` pode devolver a string entre
          # aspas, e a comparação com `success` é literal.
          conclusao_de() {
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq "[.workflow_runs[] | select(.name==\"$1\")]
                    | sort_by(.run_started_at) | last | .conclusion // \"ausente\"" \
              | tr -d '"'
          }

          liberado=true
          for wf in "Frontend tests" "E2E assinatura"; do
            # Espera curta: eles são bem mais rápidos que o Backend tests e a
            # esta altura já terminaram. O laço existe para o caso de um deles
            # ter enfileirado atrás de outro job do runner.
            for _ in $(seq 1 20); do
              c="$(conclusao_de "$wf")"
              [ "$c" = "null" ] || [ "$c" = "ausente" ] || break
              sleep 15
            done
            echo "$wf -> $c"
            if [ "$c" != "success" ]; then
              liberado=false
            fi
          done

          if [ "$liberado" = "true" ]; then
            echo "Os três verdes em ${SHA}. Deploy LIBERADO."
          else
            echo "Nem todos os testes passaram em ${SHA}. Deploy BARRADO."
          fi
          echo "liberado=$liberado" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.liberado == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Em `workflow_run` o checkout default é o topo do branch default, não
          # o commit que foi testado. Isto não muda o que a VPS baixa (ela faz
          # `git reset --hard origin/main` por conta própria), mas mantém o log
          # do job honesto sobre qual commit motivou o deploy.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Deploy to VPS
        run: |
          # Autenticação: CHAVE quando `VPS_SSH_KEY` existe, senha enquanto não
          # existir. A dupla via é TRANSITÓRIA e tem uma razão de ordem:
          #
          # O login root por senha na 22 é o vetor provável do minerador de
          # 25/08 (ver RUNBOOK, incidente). Fechá-lo exige `PermitRootLogin
          # prohibit-password` no servidor — e no minuto em que isso valer, um
          # workflow que só sabe autenticar por senha PARA DE DEPLOYAR. Trocar
          # os dois ao mesmo tempo, um no servidor e outro aqui, é o tipo de
          # coordenação que falha no pior momento.
          #
          # Com o shim a ordem deixa de importar: publique a chave em
          # `~root/.ssh/authorized_keys`, crie o secret `VPS_SSH_KEY`, confirme
          # num deploy que o log diz "chave", e SÓ ENTÃO feche a senha no
          # servidor. Depois disso, apague este bloco e o secret `VPS_PASSWORD`.
          #
          # Medido em 2026-08-27: o secret `VPS_SSH_KEY` **não existe** (há
          # VPS_HOST, VPS_PASSWORD, VPS_PORT, VPS_USER). É por isso que o
          # caminho de senha continua aqui em vez de ser removido de uma vez.
          sudo apt-get update -qq
          sudo apt-get install -y openssh-client sshpass

          mkdir -p ~/.ssh

          # A chave decide o caminho pelo TAMANHO DO ARQUIVO, não por comparar
          # o secret como string: secret ausente vira string vazia, e um
          # `id_deploy` de zero byte com `PubkeyAuthentication yes` faria o ssh
          # falhar de um jeito que não diz o que houve.
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          {
            echo "Host vps"
            echo "  HostName ${{ env.VPS_HOST }}"
            echo "  User ${{ env.VPS_USER }}"
            echo "  Port ${{ env.VPS_PORT }}"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile=/dev/null"
          } > ~/.ssh/config

          if [ -s ~/.ssh/id_deploy ]; then
            echo "::notice::Autenticando na VPS por CHAVE (VPS_SSH_KEY)."
            {
              echo "  IdentityFile ~/.ssh/id_deploy"
              echo "  IdentitiesOnly yes"
              echo "  PubkeyAuthentication yes"
              echo "  PasswordAuthentication no"
            } >> ~/.ssh/config
            ssh_vps() { ssh -v vps "$@"; }
          else
            rm -f ~/.ssh/id_deploy
            echo "::warning::VPS_SSH_KEY ausente — autenticando por SENHA. Isso exige login root por senha na porta 22, vetor provável do minerador de 25/08. Crie o secret para fechar essa porta."
            {
              echo "  PubkeyAuthentication no"
              echo "  PasswordAuthentication yes"
            } >> ~/.ssh/config
            ssh_vps() { sshpass -p "$VPS_PASSWORD" ssh -v vps "$@"; }
          fi

          chmod 600 ~/.ssh/config

          # Ensure deploy path exists
          ssh_vps "mkdir -p ${{ env.DEPLOY_PATH }} && chown -R ${{ env.VPS_USER }}:${{ env.VPS_USER }} ${{ env.DEPLOY_PATH }} || true"

          # Check if repo exists, clone if not
          ssh_vps "[ -d ${{ env.DEPLOY_PATH }}/.git ] || git clone https://github.com/jalcoforado/GedDocPublico.git ${{ env.DEPLOY_PATH }}"

          # Execute deploy script
          ssh_vps << 'DEPLOY_SCRIPT'
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Deployment Started ==="
            echo "Timestamp: $(date)"
            echo "User: $(whoami)"
            echo "Path: $(pwd)"

            DEPLOY_TYPE="${{ github.event.inputs.deploy_type || 'full' }}"

            # O SHA que o portão aprovou. `pull_code` reseta NESTE commit em vez
            # de em `origin/main`, senão um push que entre entre o fim da suíte
            # e o deploy sobe sem ter passado pelo portão — o portão aprovaria
            # um SHA e a VPS receberia outro. Em `workflow_dispatch` não há
            # `workflow_run`, e aí `github.sha` é o próprio alvo escolhido.
            export DEPLOY_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "SHA aprovado pelo portão: $DEPLOY_SHA"

            # Execute deploy command
            if [ "$DEPLOY_TYPE" = "quick" ]; then
              bash scripts/deploy.sh quick
            else
              bash scripts/deploy.sh start
            fi

            echo "=== Deployment Finished ==="
          DEPLOY_SCRIPT

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment to VPS successful!"
          echo "Backend:  http://${{ env.VPS_HOST }}:8000/api/v2"
          echo "Frontend: http://${{ env.VPS_HOST }}:8090"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment to VPS failed!"
          exit 1
