name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigos do mesmo PR/branch quando push novo entra.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12 + Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ged_user
          POSTGRES_PASSWORD: ged_password_secure_local
          POSTGRES_DB: ged_saas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Alembic + app rodando localmente fora do Docker compose
      DATABASE_URL: postgresql+asyncpg://ged_user:ged_password_secure_local@localhost:5432/ged_saas_db
      # conftest.py usa estas envs (defaults apontam pro container compose)
      PYTEST_DB_HOST: localhost
      PYTEST_DB_PORT: "5432"
      PYTEST_DB_NAME: ged_saas_db
      PYTEST_DB_PASS: ged_password_secure_local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps (+ dev)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U ged_user >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "postgres not ready after 30s"; exit 1

      - name: Enable uuid-ossp extension
        env:
          PGPASSWORD: ged_password_secure_local
        run: |
          psql -h localhost -U ged_user -d ged_saas_db \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short

      - name: Coverage report
        if: always()
        working-directory: backend
        run: pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
