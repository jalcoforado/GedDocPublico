name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antigos do mesmo PR/branch quando push novo entra.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12 + Postgres 16)
    runs-on: ubuntu-latest
    # 15 min matava a suíte: as execuções verdes de 2026-07-28 já levavam 13–14
    # min e os ~40 testes da modularização F1 empurraram por cima do limite.
    # Local a suíte leva ~10,5 min; o runner do CI é mais lento. Se voltar a
    # raspar, o conserto não é subir o teto de novo — é paralelizar ou fatiar a
    # suíte (hoje ela é serial porque compartilha um único Postgres e os testes
    # de RLS dependem disso).
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ged_user
          POSTGRES_PASSWORD: ged_password_secure_local
          POSTGRES_DB: ged_saas_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # A fixture `redis_client` (conftest) e os testes de OAuth precisam de um
      # Redis real — no compose é o serviço `redis`, aqui responde em localhost.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Alembic + app rodando localmente fora do Docker compose
      DATABASE_URL: postgresql+asyncpg://ged_user:ged_password_secure_local@localhost:5432/ged_saas_db
      # conftest.py usa estas envs (defaults apontam pro container compose)
      PYTEST_DB_HOST: localhost
      PYTEST_DB_PORT: "5432"
      PYTEST_DB_NAME: ged_saas_db
      PYTEST_DB_PASS: ged_password_secure_local
      # O runner não tem /app gravável; o storage de anexos (usado por
      # test_assinatura_v2 ao gravar o arquivo p/ o hash) vai para /tmp.
      TENANTS_STORAGE_ROOT: /tmp/uploads/tenants
      UPLOADS_DIR: /tmp/uploads/anexos
      JOBS_RESULTS_DIR: /tmp/uploads/jobs
      # DADOS_SENSIVEIS_ENCRYPTION_KEY é gerada em runtime (passo abaixo), não
      # fixada aqui: chave literal no repositório é segredo exposto. Os testes
      # cifram e decifram dentro do mesmo job, então uma chave efêmera basta.
      PYTEST_REDIS_URL: redis://localhost:6379/2
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      # Credenciais FICTÍCIAS de OAuth: os testes mockam as chamadas HTTP ao
      # Google, mas `google_oauth_flow` recusa operar com a config vazia
      # ("Google OAuth não está configurado"). Em dev os valores reais vêm de
      # backend/.env, que é gitignored e não existe no runner.
      GOOGLE_OAUTH_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
      GOOGLE_OAUTH_CLIENT_SECRET: ci-test-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/api/v2/auth/google/callback

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps (+ dev)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Gera chave Fernet efêmera para os testes
        # Sem a chave, `app.core.crypto.encrypt()` levanta CryptoConfigError e
        # os testes de Google Docs/OAuth caem. Gerar por run evita commitar
        # segredo — nada precisa decifrar dados de execuções anteriores.
        working-directory: backend
        run: |
          python -c "from cryptography.fernet import Fernet; print('DADOS_SENSIVEIS_ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U ged_user >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "postgres not ready after 30s"; exit 1

      - name: Bootstrap extensions + public helpers + cross-schema stubs
        env:
          PGPASSWORD: ged_password_secure_local
        # O dump legado referencia objetos fora de utils/protocolos/aprimora_py:
        #   - `uuid_generate_v4()` (extension uuid-ossp)
        #   - `public.trigger_set_timestamp()` (trigger global)
        #   - FKs apontando pra `despesas.feempliq` e
        #     `empresasimples.cnae_subgrupos` (schemas legados do PHP).
        # Criamos stubs mínimos pra satisfazer essas dependências — testes
        # não usam essas tabelas.
        #
        # Usa ci/bootstrap-stubs.sql (mesmo arquivo do scripts/bootstrap-db.sh)
        # em vez de duplicar o SQL aqui: a cópia inline tinha divergido e não
        # criava `sistema_chamados.tipo_chamado`, exigida pelo trigger legado
        # utils.copia_sistemas_tipochamados() ao inserir em utils.sistema.
        run: |
          psql -h localhost -U ged_user -d ged_saas_db \
            -v ON_ERROR_STOP=1 -f ci/bootstrap-stubs.sql

      - name: Load full schema dump
        env:
          PGPASSWORD: ged_password_secure_local
        # Dump schema-only inclui PHP legacy (utils/protocolos) + estado
        # pós-Alembic (aprimora_py, tenant_id, RLS, nup_sequencia, etc).
        # Em CI carregamos tudo de uma vez e depois fazemos `alembic stamp`.
        run: |
          psql -h localhost -U ged_user -d ged_saas_db \
            -v ON_ERROR_STOP=1 -f ci/legacy-schema.sql

      - name: Cria a role aprimora_app + GRANTs do baseline (ANTES das migrations)
        env:
          PGPASSWORD: ged_password_secure_local
        # A migration 0006 (pulada via stamp) cria a role `aprimora_app`.
        # Precisa existir ANTES do `upgrade head`: migrations posteriores a 0020
        # fazem `GRANT ... TO aprimora_app` ao criar suas tabelas e falham com
        # `role "aprimora_app" does not exist` se a role vier depois.
        #
        # O GRANT-cobertor (`ON ALL TABLES`) roda AQUI, e não depois do
        # `upgrade head`, por dois motivos — SEC-01A:
        #
        #  1. Rodando depois, ele DESFAZIA qualquer `REVOKE` feito por
        #     migration. A 0076 revoga de `aprimora_app` a DML de entitlement
        #     (`tenant`, `tenant_modulo`, catálogo de módulo) e a mutação da
        #     trilha de auditoria — e o cobertor devolvia tudo em silêncio.
        #  2. Rodando depois, ele dava DML nas tabelas de PLATAFORMA recém
        #     criadas (`platform_principal`, `platform_audit_log`), que só
        #     `aprimora_platform` pode escrever (ADR-016 §2.3).
        #
        # Consequência desejada: os GRANTs das migrations são os FINAIS, e o CI
        # passa a ter o mesmo estado de privilégios que `scripts/bootstrap-db.sh`
        # produz localmente (lá o cobertor já vinha antes do upgrade). Tabela
        # nova sem `GRANT` explícito na própria migration deixa de ser coberta —
        # que é a disciplina que o CLAUDE.md já exige.
        #
        # Só os schemas do baseline entram: `pagamentos`, `frota` e
        # `transporte_regulado` nascem nas migrations e concedem os próprios
        # grants (USAGE no schema incluído).
        run: |
          psql -h localhost -U ged_user -d ged_saas_db <<'SQL'
            DO $$ BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'aprimora_app') THEN
                CREATE ROLE aprimora_app LOGIN NOSUPERUSER NOBYPASSRLS
                  PASSWORD 'ged_password_secure_local';
              END IF;
            END $$;
            GRANT CONNECT ON DATABASE ged_saas_db TO aprimora_app;
            GRANT USAGE ON SCHEMA protocolos, utils, aprimora_py, public TO aprimora_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA protocolos, utils, aprimora_py, public TO aprimora_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA protocolos, utils, aprimora_py, public TO aprimora_app;
          SQL

      - name: Stamp baseline do dump + roda migrations pendentes
        working-directory: backend
        # O dump (ci/legacy-schema.sql) reflete o schema na revision 0020 e tem
        # alembic_version vazio. Carimbamos 0020 (não rodar 0001..0020, que já
        # existem no dump) e então `upgrade head` roda só as migrations novas
        # (ex.: 0021) — assim o CI EXERCITA a migration nova em banco limpo.
        # Ao regenerar o dump, atualize o baseline aqui.
        run: |
          alembic stamp 0020
          alembic upgrade head

      # NÃO reintroduza aqui um `GRANT ... ON ALL TABLES ... TO aprimora_app`.
      # Ele existia neste ponto e foi movido para ANTES do `upgrade head` em
      # SEC-01A (ver o comentário do passo "Cria a role aprimora_app"): rodando
      # depois das migrations, desfazia os `REVOKE` da 0076 e dava DML nas
      # tabelas de plataforma. `tests/test_platform_admin_identity.py` reprova o
      # CI se isso voltar.

      - name: Seed dos catálogos globais
        env:
          PGPASSWORD: ged_password_secure_local
        # ci/legacy-schema.sql é schema-only. `provisionar_tenant` — chamado por
        # quase todo teste — exige dois registros de catálogo GLOBAL que não vêm
        # de migration nenhuma: utils.nivel com valor=0 e utils.sistema com
        # app='sistemas'. Sem eles o provisionamento estoura em cascata
        # (ProvisioningError: "Pré-requisitos globais ausentes").
        # ci/seed-e2e.sql já semeia esses dois + protocolos.acao ABERTURA
        # (exigida ao abrir processo) e é idempotente (ON CONFLICT DO NOTHING).
        run: |
          psql -h localhost -U ged_user -d ged_saas_db \
            -v ON_ERROR_STOP=1 -f ci/seed-e2e.sql

      - name: Seed bootstrap (constantes + tenant/admin padrão)
        working-directory: backend
        # Popula utils.sistema_constante — sem KEY_LOGIN_GLOBAL_JWT o login
        # estoura com "KEY_LOGIN_GLOBAL_JWT not found in utils.sistema_constante".
        # Mesmo seed usado por scripts/bootstrap-db.sh; idempotente.
        run: python -m app.cli.seed_bootstrap

      # UMA execução, com cobertura junto. Até 2026-08-16 eram DUAS: este passo
      # e um "Coverage report" logo abaixo que rodava `pytest tests/` de novo,
      # inteiro. Medido no run 95111304477: 8 min 49 s a primeira, 10 min 11 s a
      # segunda (instrumentada) — ou seja, **mais da metade do job era a mesma
      # suíte rodando outra vez**, e o item 1.0.66 do backlog discutia
      # `pytest-xdist` e banco por worker sem que ninguém tivesse olhado onde o
      # tempo ia. O bootstrap inteiro, que parecia o suspeito, leva 35 s.
      #
      # Rodar instrumentado é seguro aqui: os dois runs fechavam `1378 passed`,
      # então o `|| true` do passo antigo não estava mascarando nada. Se um dia
      # mascarar, é melhor que apareça.
      #
      # NÃO reintroduza um segundo `pytest tests/` neste workflow — duplicar a
      # suíte não quebra nada, só custa, e por isso volta em silêncio.
      # `tests/test_guarda_suite_unica_no_ci.py` reprova.
      - name: Run pytest (com cobertura na mesma execução)
        working-directory: backend
        run: >
          pytest tests/ -v --tb=short
          --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
