# Alembic configuration — backend Aprimora-py.
#
# Lê DATABASE_URL via env.py (convertendo +asyncpg → +psycopg2 sincrono).
# Migrations versionam APENAS o que pertence ao Python:
#   - schema aprimora_py.*
#   - colunas senha_bcrypt em utils.usuario/usuario_externo
# NUNCA toca o resto do schema (utils/protocolos/public) — pertence ao PHP.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
