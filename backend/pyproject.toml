[project]
name = "aprimora-backend"
version = "0.1.0"
description = "Aprimora migration backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "asyncpg==0.30.0",
  "psycopg2-binary==2.9.10",
  "pydantic[email]==2.10.3",
  "pydantic-settings==2.7.0",
  "python-jose[cryptography]==3.3.0",
  "python-multipart==0.0.20",
  "httpx==0.28.1",
  "reportlab==4.2.5",
  "pypdf==5.1.0",
  "weasyprint==63.1",
  "celery==5.4.0",
  "redis==5.2.1",
  # kombu é dependência TRANSITIVA do celery e precisa de teto próprio: a
  # 5.7.0 passou a exigir redis-py >= 6.1.0 no transporte redis, e com a
  # `redis==5.2.1` acima o worker morre no start com
  # `kombu.exceptions.VersionMismatch` — em loop, 93 restarts observados.
  # Nada no código muda; quem muda é o resolvedor do pip, então uma imagem
  # buildada antes da 5.7.0 funciona e a buildada depois não. `celery==5.4.0`
  # aceita kombu >= 5.3.4, < 6.0, e a faixa abaixo fica dentro disso (5.6.2
  # verificada contra o broker).
  # Subir para redis-py >= 6.1.0 é a outra saída, maior: exige validar o
  # celery 5.4.0 com a 6.x.
  "kombu>=5.3.4,<5.7.0",
  "bcrypt==4.2.1",
  "alembic==1.14.0",
  "simpleeval==1.0.3",
  "aiosmtplib==3.0.2",
  "bleach==6.1.0",
  "google-auth-oauthlib==1.2.0",
  "google-auth-httplib2==0.2.0",
  "google-api-python-client==2.108.0",
  "python-docx==1.0.1",
  "anthropic==0.121.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "PyJWT==2.10.1",
]
# Object storage S3/MinIO — EXPERIMENTAL, desligado por padrão
# (`STORAGE_BACKEND=local`). A imagem não o instala; `services/storage.py`
# importa aioboto3 só dentro de `S3Storage`.
s3 = [
  "aioboto3==12.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
