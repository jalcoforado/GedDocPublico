# ============================================================================
# Strangler Fig — roteamento gradual PHP → Python (Fase 9.1 → 9.4.2)
#
# Decisão por rota:
#  - /api/v2/*                → backend FastAPI (sempre Python)
#  - rotas migradas listadas  → frontend Next.js (Python)
#  - tudo o mais              → PHP legacy (Apache em :8081)
#
# Header `X-Aprimora-Backend` é adicionado em cada resposta para depuração:
#  - "python-frontend" / "python-backend" / "php-legacy"
#
# Para adicionar uma rota migrada nova: incluir o nome (sem barras) no token
# central da regex em `location ~ ^/(login|home|...)`.
# ============================================================================

# Resolver Docker (Fase 9.4.2 #5) — evita IP cacheado quando containers
# recreatam. `valid=10s` revalida a cada 10s. Sem isso, recreate do backend
# deixa o nginx mandando 502 até reload manual.
resolver 127.0.0.11 valid=10s ipv6=off;

# Log com backend (CUTOVER passo 1) — adiciona qual backend serviu no fim
# de cada linha, separado por |. Permite query:
#   awk -F'|' '$3 ~ /php-legacy/ {print}' /var/log/nginx/access.log
# pra inventariar URLs ainda em PHP.
log_format aprimora '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '|backend=$backend|host=$host';
access_log /var/log/nginx/access.log aprimora;

# Rate limit (Fase 9.4.2 #6) — 5 req/min por IP no login (admin + cidadão).
# Burst=10 absorve clique duplo; depois bloqueia.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Rate limit da validação pública de assinatura (PR2e) — borda dura por IP.
# O app tem rate-limit/audit-dedup próprio (defesa em profundidade).
limit_req_zone $binary_remote_addr zone=validacao_publica:10m rate=20r/m;

# Atalho: parâmetros comuns de proxy.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Timeouts mais generosos (upload 20MB de PDF demora).
proxy_connect_timeout 60s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;

server {
  listen 80;
  # Catch-all server_name: aceita localhost (dev), *.aprimora.local (dev com
  # /etc/hosts), e *.aprimora.app (prod). O nginx repassa `Host: $host` adiante
  # e o TenantMiddleware do FastAPI extrai o subdomínio (Fase 12).
  server_name _;
  client_max_body_size 50m;

  # Compressão (Fase 9.4.2 sugestão) — JSON/HTML grandes ficam ~70% menores.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/html text/plain text/xml;

  # Headers de segurança (Fase 9.4.2 sugestão) — defesa em camadas.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Aprimora-Backend $backend always;

  # Default: marca cada resposta com qual backend a serviu.
  set $backend "python-frontend";

  # ----- Sempre Python (API) -----
  # Login com rate limit. Usar `set` ANTES de proxy_pass para que o header sai certo.
  location = /api/v2/auth/login {
    limit_req zone=login burst=10 nodelay;
    set $backend "python-backend";
    set $upstream_api "http://backend:8000";
    proxy_pass $upstream_api;
  }

  location = /api/v2/cidadao/login {
    limit_req zone=login burst=10 nodelay;
    set $backend "python-backend";
    set $upstream_api "http://backend:8000";
    proxy_pass $upstream_api;
  }

  # Validação pública (PR2e) — anônima, com rate-limit de borda por IP.
  # Prefixo mais específico que /api/v2/ → casa primeiro (longest-match).
  location /api/v2/publico/ {
    limit_req zone=validacao_publica burst=20 nodelay;
    set $backend "python-backend";
    set $upstream_api "http://backend:8000";
    proxy_pass $upstream_api;
  }

  location /api/v2/ {
    set $backend "python-backend";
    # Variável força o nginx a re-resolver a cada request (vs upstream estático).
    set $upstream_api "http://backend:8000";
    proxy_pass $upstream_api;
  }

  # Hot-reload do Next.js (HMR via websocket)
  location /_next/webpack-hmr {
    set $upstream_next "http://frontend:3000";
    proxy_pass $upstream_next;
  }

  # ----- Rotas migradas para o Next.js (Python) -----
  location = / {
    set $backend "python-frontend";
    set $upstream_next "http://frontend:3000";
    proxy_pass $upstream_next;
  }
  location = /favicon.ico {
    set $upstream_next "http://frontend:3000";
    proxy_pass $upstream_next;
  }
  location /_next/ {
    set $upstream_next "http://frontend:3000";
    proxy_pass $upstream_next;
  }

  # Match exato OU subpath (`/login`, `/login/...`) mas NÃO `/login_externo`.
  # Para adicionar nova rota: incluir só o nome no `(...|...)`.
  location ~ ^/(login|home|perfil|processos|protocolo|para-assinar|validar|admin|usuarios|unidades-trabalho|grupos|cidades|bairros|enderecos|manifestantes|tipos-manifestante|tipos-processo|assuntos|tipos-anexo|relatorios|jobs|cidadao|workflow|dashboard|organograma|auditoria|busca|configuracoes|servicos|alterar-senha-obrigatoria)(/.*)?$ {
    set $backend "python-frontend";
    set $upstream_next "http://frontend:3000";
    proxy_pass $upstream_next;
  }

  # ----- Fallback: PHP legacy -----
  # Todo path não capturado pelos blocos acima cai aqui (URLs ainda não migradas).
  location / {
    set $backend "php-legacy";
    set $upstream_php "http://protocolo:80";
    proxy_pass $upstream_php;
  }
}
