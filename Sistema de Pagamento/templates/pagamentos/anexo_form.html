{% extends "base.html" %}
{% block title %}Anexar Documento{% endblock %}
{% block content %}
<h3 class="mb-4">Anexar Documento — {{ pedido.protocolo }}</h3>
<div class="card p-4" style="max-width: 600px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Enviar Anexo</button>
        <a href="{% url 'pagamentos:detalhe' pedido.pk %}" class="btn btn-outline-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
